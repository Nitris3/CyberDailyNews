# Curated public cyber-intelligence sources. Priority ranges from 1 (supplemental)
# to 5 (authoritative or immediately actionable).
sources:
  # Government and coordination centers
  - name: CISA Cybersecurity Advisories
    kind: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    category: Government Advisories
    priority: 5
    enabled: false  # Returns HTTP 403 from the deployment runtime; KEV remains active.
  - name: CISA News
    kind: rss
    url: https://www.cisa.gov/news.xml
    category: Government Advisories
    priority: 4
    enabled: false  # Returns HTTP 403 from the deployment runtime.
  - name: CISA Known Exploited Vulnerabilities
    kind: api
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    category: Exploited Vulnerabilities
    priority: 5
    enabled: true
  - name: CERT Coordination Center
    kind: rss
    url: https://kb.cert.org/vuls/atomfeed/
    category: Vulnerabilities
    priority: 5
    enabled: true
  - name: SANS Internet Storm Center
    kind: rss
    url: https://isc.sans.edu/rssfeed.xml
    category: Threat Activity
    priority: 5
    enabled: true

